<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎪 Wobbly Life Playroom 3D | Antigravity Physics Sandbox</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- High-Gloss Lacquer Material Design System -->
  <link rel="stylesheet" href="high-gloss-lacquer.css">
  <script src="high-gloss-lacquer.js"></script>

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a1128;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Glassmorphic Playroom HUD */
    .glass-hud {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(250, 204, 21, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background: rgba(5, 11, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @keyframes wobbleFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.5deg); }
    }
    .wobble-anim {
      animation: wobbleFloat 3.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="text-slate-100 selection:bg-amber-400 selection:text-slate-950">

  <!-- 1. Fullscreen 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- 2. Top Global Navigation Header -->
  <header class="fixed top-0 left-0 right-0 z-20 h-14 bg-[#0a1128]/90 backdrop-blur-md border-b border-amber-400/25 px-4 flex items-center justify-between">
    <!-- Left: Branding -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-400 via-yellow-300 to-sky-400 p-[1.5px] shadow-md shadow-amber-400/20 flex items-center justify-center">
        <div class="w-full h-full bg-[#0a1128] rounded-[6px] flex items-center justify-center text-sm font-bold text-amber-400 wobble-anim">
          🎪
        </div>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-sm font-black text-white tracking-tight">Wobbly Playroom 3D</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold">
            WOBBLY LIFE SANDBOX
          </span>
        </div>
        <p class="text-[10px] text-slate-400 font-mono hidden sm:block">
          Ragdoll Physics • Trampoline • Ball Pit • Drivable Kart • Toy Courier
        </p>
      </div>
    </div>

    <!-- Center: Wobbly Economy & Delivery Tracker -->
    <div class="flex items-center gap-3">
      <!-- Wobbly Coins Badge -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-xl bg-amber-500/20 border border-amber-400/50 shadow-sm font-mono font-black text-xs text-amber-300">
        <span>🪙</span>
        <span id="wobbly-coins-val">$250</span>
      </div>

      <!-- Hat Closet Button -->
      <button onclick="toggleHatModal()" class="px-3 py-1 rounded-lg text-xs font-mono font-bold bg-white/5 hover:bg-white/10 text-slate-200 border border-white/15 transition-[transform,opacity,background-color,border-color,color,box-shadow] flex items-center gap-1.5" title="Open Wobbly Hat Closet">
        <span>🎩</span>
        <span class="hidden sm:inline">Hats</span>
      </button>
    </div>

    <!-- Right: Navigation Links & Controls -->
    <div class="flex items-center gap-2">
      <button id="wobbly-audio-btn" class="px-3 py-1 rounded-lg text-xs font-mono font-semibold bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 transition-[transform,opacity,background-color,border-color,color,box-shadow]">
        🔊 Audio On
      </button>

      <a href="../grade-school-hall/index.html" class="px-3 py-1 rounded-lg text-xs font-mono font-semibold bg-blue-500/10 text-blue-300 border border-blue-500/30 hover:border-blue-400 transition-[transform,opacity,background-color,border-color,color,box-shadow] hidden md:flex items-center gap-1" title="Launch 3D Grade School Hall">
        <span>🎒</span> Grade School Hall
      </a>

      <a href="../learning-hall/index.html" class="px-3 py-1 rounded-lg text-xs font-mono font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:border-amber-400 transition-[transform,opacity,background-color,border-color,color,box-shadow] hidden md:flex items-center gap-1" title="Launch 3D Learning Hall">
        <span>🏛️</span> Learning Hall
      </a>

      <a href="../index.html" class="px-3 py-1 rounded-lg text-xs font-mono font-semibold bg-[#0e1d3a] text-[#dfba73] border border-[#c5a059]/30 hover:border-[#c5a059] transition-[transform,opacity,background-color,border-color,color,box-shadow] flex items-center gap-1">
        <span>⚡</span> Baselines
      </a>

      <button class="px-2.5 py-1 rounded-lg text-xs font-mono bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10" onclick="AntigravityEnterprise.toggleFullscreen()" title="Fullscreen">
        ⛶
      </button>
    </div>
  </header>

  <!-- 3. Delivery Mini-Job Banner HUD (Appears when carrying delivery items) -->
  <div id="delivery-hud" class="fixed top-16 left-1/2 -translate-x-1/2 z-20 hidden transition-[transform,opacity,background-color,border-color,color,box-shadow] duration-300">
    <div class="glass-hud px-5 py-2.5 rounded-full flex items-center gap-4">
      <div class="flex items-center gap-1.5 font-mono text-xs text-amber-300">
        <span class="text-lg">🍕</span>
        <strong id="delivery-desc" class="text-white">Delivery In Progress: Carry to Golden Dropzone!</strong>
      </div>
      <div class="flex items-center gap-1 text-xs font-mono px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/40">
        <span>⏱️</span>
        <span id="delivery-timer" class="font-bold">35s</span>
      </div>
    </div>
  </div>

  <!-- 4. Bottom Floating RPG Action Dock (Run, Jump, Grab/Throw, Flop, Kart, View) -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20 w-[96%] max-w-4xl">
    <div class="glass-hud rounded-2xl p-3 md:p-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
        
        <!-- Left: Status & Instructions -->
        <div class="hidden md:flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono text-amber-400 font-bold">WASD:</span>
            <span class="text-xs text-slate-300">Wobble</span>
            <span class="text-slate-600">|</span>
            <span class="text-xs font-mono text-amber-400 font-bold">G/F:</span>
            <span class="text-xs text-slate-300">Grab/Throw</span>
            <span class="text-slate-600">|</span>
            <span class="text-xs font-mono text-amber-400 font-bold">R:</span>
            <span class="text-xs text-slate-300">Flop</span>
          </div>
        </div>

        <!-- Right: Tactile Action Button Cluster -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-center sm:justify-end flex-wrap sm:flex-nowrap">
          <!-- RUN Button -->
          <button id="wobbly-run-btn" class="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-amber-400/20 text-slate-200 hover:text-amber-300 border border-white/15 hover:border-amber-400/50 transition-[transform,opacity,background-color,border-color,color,box-shadow] font-mono text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 select-none" title="Toggle / Hold Sprint Speed (Shift)">
            <span id="wobbly-run-icon">⚡</span>
            <span id="wobbly-run-label">RUN [Shift]</span>
          </button>

          <!-- JUMP Button -->
          <button id="wobbly-jump-btn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-mono text-xs font-bold transition-[transform,opacity,background-color,border-color,color,box-shadow] shadow-lg shadow-amber-500/25 flex items-center gap-1.5 active:scale-95 select-none" title="Spring launch into the air (Space)">
            <span>🚀</span>
            <span>JUMP [Space]</span>
          </button>

          <!-- GRAB / THROW Button -->
          <button id="wobbly-grab-btn" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-emerald-500/20 text-slate-200 hover:text-emerald-300 border border-white/15 hover:border-emerald-500/50 transition-[transform,opacity,background-color,border-color,color,box-shadow] font-mono text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 select-none" title="Grab / Throw Nearest Toy (G / F)">
            <span>🤹</span>
            <span>GRAB [G]</span>
          </button>

          <!-- FLOP / WOBBLE Button -->
          <button id="wobbly-flop-btn" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-purple-500/20 text-slate-200 hover:text-purple-300 border border-white/15 hover:border-purple-500/50 transition-[transform,opacity,background-color,border-color,color,box-shadow] font-mono text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 select-none" title="Ragdoll Flop & Tumble (R)">
            <span>🌀</span>
            <span>FLOP [R]</span>
          </button>

          <!-- RIDE KART Button -->
          <button id="wobbly-kart-btn" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-rose-500/20 text-slate-200 hover:text-rose-300 border border-white/15 hover:border-rose-500/50 transition-[transform,opacity,background-color,border-color,color,box-shadow] font-mono text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 select-none" title="Enter or Exit Bumper Kart (E)">
            <span>🏎️</span>
            <span>RIDE KART [E]</span>
          </button>

          <!-- VIEW MODE Toggle Button -->
          <button id="wobbly-view-btn" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-200 border border-white/15 transition-[transform,opacity,background-color,border-color,color,box-shadow] font-mono text-xs font-bold flex items-center gap-1.5 active:scale-95 select-none" title="Switch 3rd Person / 1st Person (V)">
            <span class="text-amber-400">🏃</span>
            <span id="wobbly-view-label">3rd Person</span>
            <span class="text-[10px] text-slate-400 border border-white/10 px-1 rounded">V</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- 5. Wobbly Hat Closet Modal -->
  <div id="hat-modal" class="fixed inset-0 z-30 hidden modal-backdrop flex items-center justify-center p-4">
    <div class="bg-[#0b1328] border border-amber-400/40 rounded-3xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/10">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <span>🎩</span> Wobbly Hat Closet
        </h2>
        <button onclick="toggleHatModal()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center font-mono">
          ✕
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button data-hat="propeller" class="hat-select-btn p-3 rounded-2xl bg-white/5 hover:bg-amber-500/20 border border-white/10 transition-[transform,opacity,background-color,border-color,color,box-shadow] flex flex-col items-center gap-2 text-center ring-2 ring-amber-400 bg-amber-500/20">
          <span class="text-3xl">🚁</span>
          <span class="font-bold text-xs text-white">Propeller Cap</span>
          <span class="text-[10px] text-slate-400">Spinning rotor blades</span>
        </button>

        <button data-hat="chef" class="hat-select-btn p-3 rounded-2xl bg-white/5 hover:bg-amber-500/20 border border-white/10 transition-[transform,opacity,background-color,border-color,color,box-shadow] flex flex-col items-center gap-2 text-center">
          <span class="text-3xl">👨‍🍳</span>
          <span class="font-bold text-xs text-white">Chef Toque</span>
          <span class="text-[10px] text-slate-400">Master pizza chef</span>
        </button>

        <button data-hat="crown" class="hat-select-btn p-3 rounded-2xl bg-white/5 hover:bg-amber-500/20 border border-white/10 transition-[transform,opacity,background-color,border-color,color,box-shadow] flex flex-col items-center gap-2 text-center">
          <span class="text-3xl">👑</span>
          <span class="font-bold text-xs text-white">Royal Crown</span>
          <span class="text-[10px] text-slate-400">King of the sandbox</span>
        </button>

        <button data-hat="cone" class="hat-select-btn p-3 rounded-2xl bg-white/5 hover:bg-amber-500/20 border border-white/10 transition-[transform,opacity,background-color,border-color,color,box-shadow] flex flex-col items-center gap-2 text-center">
          <span class="text-3xl">🎉</span>
          <span class="font-bold text-xs text-white">Party Cone</span>
          <span class="text-[10px] text-slate-400">Party celebration</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="wobbly-playroom-scene.js"></script>
  <script src="wobbly-playroom-engine.js"></script>
  <script>
    let sceneInstance = null;
    let engineInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      sceneInstance = new WobblyPlayroomScene('canvas-container');
      engineInstance = new WobblyPlayroomEngine(sceneInstance);

      window.sceneInstance = sceneInstance;
      window.engineInstance = engineInstance;

      // Start render loop & physics tick
      sceneInstance.animate();

      function physicsLoop() {
        requestAnimationFrame(physicsLoop);
        engineInstance.update();
      }
      physicsLoop();
    });

    function toggleHatModal() {
      const modal = document.getElementById('hat-modal');
      if (modal) modal.classList.toggle('hidden');
    }
  </script>
</body>
</html>
